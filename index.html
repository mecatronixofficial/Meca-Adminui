<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mecatronix Admin</title>
    <meta name="description" content="Secure admin console for the Mecatronix website: enquiries, invoices, quotations, projects and website content." />
    <meta name="application-name" content="Mecatronix Admin" />
    <meta name="author" content="Mecatronix Software Development" />

    <!-- Private console: never index, follow, cache in search results or translate-proxy. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0b0d12" />

    <!-- Icons and install -->
    <!-- ?v= busts browser and CDN caches: bump it whenever the logo changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-title" content="Meca Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews (chat apps, email). %SITE_URL% is set from VITE_ADMIN_URL at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mecatronix" />
    <meta property="og:title" content="Mecatronix Admin" />
    <meta property="og:description" content="Secure admin console for the Mecatronix website." />
    <meta property="og:image" content="%SITE_URL%/icons/icon-512.png?v=2" />
    <meta property="og:image:secure_url" content="%SITE_URL%/icons/icon-512.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Mecatronix logo" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mecatronix Admin" />
    <meta name="twitter:description" content="Secure admin console for the Mecatronix website." />
    <meta name="twitter:image" content="%SITE_URL%/icons/icon-512.png?v=2" />
    <meta name="twitter:image:alt" content="Mecatronix logo" />
  </head>
  <body>
    <noscript>
      <p style="font: 16px/1.5 system-ui, sans-serif; padding: 2rem; text-align: center">
        Mecatronix Admin needs JavaScript. Please enable it in your browser settings and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
